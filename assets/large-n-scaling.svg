<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc">
<title id="title">GNN scaling from N=10,000 to N=20,000</title>
<desc id="desc">Paper-reported mean F1 across the final 12 tasks</desc>
