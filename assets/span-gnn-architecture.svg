<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
<title id="title">SPAN architecture</title>
<desc id="desc">SCHEMATIC of the uploaded WeightedGAT_LSTM implementation; not a measured result</desc>
<style>text{font-family:Inter,Arial,sans-serif;fill:#183153}.title{font-size:28px;font-weight:700}.sub{font-size:14px;fill:#526579}.label{font-size:14px}.small{font-size:12px;fill:#526579}.value{font-size:12px;font-weight:700}.box{stroke:#c9d5e3;stroke-width:1.5}.axis{stroke:#9eafc1}.grid{stroke:#e5ebf2}.arrow{stroke:#49647e;stroke-width:2;fill:none}</style>
<rect width="100%" height="100%" fill="#fbfcfe"/>
<text x="50" y="50" class="title">SPAN architecture</text>
<text x="50" y="76" class="sub">SCHEMATIC of the uploaded WeightedGAT_LSTM implementation; not a measured result</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#49647e"/></marker></defs>
<rect x="45" y="155" width="190" height="150" rx="15" fill="#e8f1ff" class="box"/>
<text x="67" y="210" font-size="18" font-weight="700">Longitudinal nodes</text>
<text x="67" y="245" class="small">9 variables × 40 times</text>
<path d="M243 230 L288 230" class="arrow" marker-end="url(#a)"/>
<rect x="300" y="155" width="190" height="150" rx="15" fill="#eef3f8" class="box"/>
<text x="322" y="210" font-size="18" font-weight="700">LSTM encoder</text>
<text x="322" y="245" class="small">Per-node temporal history</text>
<path d="M498 230 L543 230" class="arrow" marker-end="url(#a)"/>
<rect x="555" y="135" width="220" height="150" rx="15" fill="#e6f7f3" class="box"/>
<text x="577" y="190" font-size="18" font-weight="700">Weighted GATv2</text>
<text x="577" y="225" class="small">Edge-aware attention retained</text>
<path d="M783 230 L833 230" class="arrow" marker-end="url(#a)"/>
<rect x="845" y="155" width="220" height="150" rx="15" fill="#f7f0ff" class="box"/>
<text x="867" y="210" font-size="18" font-weight="700">Prediction / importance</text>
<text x="867" y="245" class="small">Descriptive, not causal</text>
<text x="45" y="465" class="small">Source: models_weightedgat_temporal.py and temporal_encoders.py. Attribution needs independent validation for causal interpretation.</text>
</svg>
